server:
  port: 8085
  servlet:
    context-path: /costiq

spring:
  application:
    name: CostIQ

  datasource:
    url: jdbc:mysql://localhost:3306/costiq_db
    username: root
    password: localroot
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        # Remove explicit dialect — Hibernate 6 auto-detects MySQL 8, suppresses HHH90000025 warning
        format_sql: true
    open-in-view: false

  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: costiq-app
            # client-authentication-method: none is REQUIRED for PKCE.
            # Without it, Spring Security treats this as a confidential client
            # and omits the code_challenge / code_challenge_method parameters,
            # causing Keycloak to reject with: Missing parameter: code_challenge_method
            client-authentication-method: none
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
              - email
        provider:
          keycloak:
            issuer-uri: http://localhost:8080/realms/costiq-realm
            user-name-attribute: preferred_username
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/costiq-realm

  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html

logging:
  level:
    com.enterprise.costiq: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN

costiq:
  app:
    title: "CostIQ — Enterprise Cost Spend Analysis"
    company: "GlobalBite Foods Inc."
    version: "1.0.0"