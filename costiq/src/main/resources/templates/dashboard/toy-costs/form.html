<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body class="costiq-app d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="costiq-body d-flex flex-grow-1">
  <aside th:replace="~{fragments/layout :: sidebar}"></aside>
  <main class="costiq-main flex-grow-1 p-4 overflow-auto">
    <div class="d-flex align-items-center mb-4">
      <a th:href="@{/dashboard/toy-costs}" class="btn btn-outline-secondary btn-sm me-3">
        <i class="bi bi-arrow-left me-1"></i>Back
      </a>
      <div>
        <h4 class="fw-bold mb-0" th:text="${pageTitle}">Toy Allocation</h4>
        <p class="text-muted small mb-0"
           th:text="${isEdit} ? 'Modify toy allocation entry' : 'Record a new campaign toy allocation cost'"></p>
      </div>
    </div>

    <div class="card border-0 shadow-sm" style="max-width:900px;">
      <div class="card-header bg-warning py-3">
        <h6 class="mb-0 text-dark">
          <i class="bi bi-gift me-2"></i>
          <span th:text="${isEdit} ? 'Edit Toy Allocation' : 'New Toy Allocation'"></span>
        </h6>
      </div>
      <div class="card-body p-4">
        <form th:action="${isEdit} ? @{/dashboard/toy-costs/{id}/edit(id=${form.id})} : @{/dashboard/toy-costs/new}"
              th:object="${form}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Campaign <span class="text-danger">*</span></label>
              <select th:field="*{campaignId}" class="form-select"
                      th:classappend="${#fields.hasErrors('campaignId')} ? 'is-invalid'">
                <option value="">— Select Campaign —</option>
                <option th:each="c : ${campaigns}"
                        th:value="${c.id}"
                        th:text="${c.name + ' [' + c.status + ']'}"></option>
              </select>
              <div class="invalid-feedback" th:errors="*{campaignId}"></div>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Toy Item <span class="text-danger">*</span></label>
              <select th:field="*{toyItemId}" class="form-select"
                      th:classappend="${#fields.hasErrors('toyItemId')} ? 'is-invalid'">
                <option value="">— Select Toy Item —</option>
                <option th:each="t : ${toyItems}"
                        th:value="${t.id}"
                        th:text="${t.name + ' (' + t.sku + ')'}"></option>
              </select>
              <div class="invalid-feedback" th:errors="*{toyItemId}"></div>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Country <span class="text-danger">*</span></label>
              <select th:field="*{countryId}" class="form-select"
                      th:classappend="${#fields.hasErrors('countryId')} ? 'is-invalid'">
                <option value="">— Select Country —</option>
                <option th:each="c : ${countries}"
                        th:value="${c.id}"
                        th:text="${c.name + ' (' + c.region.name + ')'}"></option>
              </select>
              <div class="invalid-feedback" th:errors="*{countryId}"></div>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Supplier <span class="text-danger">*</span></label>
              <select th:field="*{supplierId}" class="form-select"
                      th:classappend="${#fields.hasErrors('supplierId')} ? 'is-invalid'">
                <option value="">— Select Supplier —</option>
                <option th:each="s : ${suppliers}"
                        th:value="${s.id}"
                        th:text="${s.name}"></option>
              </select>
              <div class="invalid-feedback" th:errors="*{supplierId}"></div>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Fiscal Period <span class="text-danger">*</span></label>
              <select th:field="*{fiscalPeriodId}" class="form-select"
                      th:classappend="${#fields.hasErrors('fiscalPeriodId')} ? 'is-invalid'">
                <option value="">— Select Period —</option>
                <option th:each="fp : ${periods}"
                        th:value="${fp.id}"
                        th:text="${fp.displayName}"></option>
              </select>
              <div class="invalid-feedback" th:errors="*{fiscalPeriodId}"></div>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Distribution Channel</label>
              <select th:field="*{distributionChannel}" class="form-select">
                <option th:each="ch : ${channels}"
                        th:value="${ch}"
                        th:text="${ch}"></option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Entry Date <span class="text-danger">*</span></label>
              <input type="date" th:field="*{entryDate}" class="form-control"
                     th:classappend="${#fields.hasErrors('entryDate')} ? 'is-invalid'"/>
              <div class="invalid-feedback" th:errors="*{entryDate}"></div>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">Quantity <span class="text-danger">*</span></label>
              <input type="number" th:field="*{quantity}" class="form-control"
                     step="1" min="1"
                     th:classappend="${#fields.hasErrors('quantity')} ? 'is-invalid'"/>
              <div class="invalid-feedback" th:errors="*{quantity}"></div>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">Unit Cost (USD) <span class="text-danger">*</span></label>
              <div class="input-group">
                <span class="input-group-text">$</span>
                <input type="number" th:field="*{unitCostUsd}" class="form-control"
                       step="0.0001" min="0.0001"
                       th:classappend="${#fields.hasErrors('unitCostUsd')} ? 'is-invalid'"/>
              </div>
              <div class="invalid-feedback" th:errors="*{unitCostUsd}"></div>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">Computed Total (USD)</label>
              <input type="text" class="form-control bg-light text-warning fw-bold"
                     id="computedTotal" readonly placeholder="Auto-calculated"/>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Invoice Reference</label>
              <input type="text" th:field="*{invoiceRef}" class="form-control"/>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">PO Number</label>
              <input type="text" th:field="*{poNumber}" class="form-control"/>
            </div>
            <div class="col-12">
              <label class="form-label fw-semibold">Notes</label>
              <textarea th:field="*{notes}" class="form-control" rows="2"></textarea>
            </div>
          </div>
          <hr class="my-4"/>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-warning px-4">
              <i class="bi bi-check-lg me-1"></i>
              <span th:text="${isEdit} ? 'Update Allocation' : 'Create Allocation'"></span>
            </button>
            <a th:href="@{/dashboard/toy-costs}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </main>
</div>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
<script>
  const qtyInput  = document.querySelector('[name="quantity"]');
  const costInput = document.querySelector('[name="unitCostUsd"]');
  const totalEl   = document.getElementById('computedTotal');
  function updateTotal() {
    const qty  = parseFloat(qtyInput?.value) || 0;
    const cost = parseFloat(costInput?.value) || 0;
    totalEl.value = '$' + (qty * cost).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
  }
  qtyInput?.addEventListener('input', updateTotal);
  costInput?.addEventListener('input', updateTotal);
  updateTotal();
</script>
</body>
</html>
