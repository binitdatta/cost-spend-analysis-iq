<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body class="costiq-app d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="costiq-body d-flex flex-grow-1">
  <aside th:replace="~{fragments/layout :: sidebar}"></aside>
  <main class="costiq-main flex-grow-1 p-4 overflow-auto">

    <div class="d-flex align-items-center mb-4">
      <a th:href="@{/dashboard/food-costs}" class="btn btn-outline-secondary btn-sm me-3">
        <i class="bi bi-arrow-left me-1"></i>Back to List
      </a>
      <h4 class="fw-bold mb-0" th:text="'Food Cost Entry #' + ${entry.id}"></h4>
      <div class="ms-auto d-flex gap-2">
        <a th:href="@{/dashboard/food-costs/{id}/edit(id=${entry.id})}"
           class="btn btn-primary btn-sm">
          <i class="bi bi-pencil me-1"></i>Edit
        </a>
      </div>
    </div>

    <div class="row g-4" style="max-width:900px;">
      <div class="col-md-6">
        <div class="card border-0 shadow-sm h-100">
          <div class="card-header bg-success text-white">
            <h6 class="mb-0"><i class="bi bi-basket2 me-2"></i>Food Item Details</h6>
          </div>
          <div class="card-body">
            <dl class="row mb-0">
              <dt class="col-sm-5 text-muted">SKU</dt>
              <dd class="col-sm-7 fw-semibold" th:text="${entry.foodItem.sku}"></dd>
              <dt class="col-sm-5 text-muted">Name</dt>
              <dd class="col-sm-7" th:text="${entry.foodItem.name}"></dd>
              <dt class="col-sm-5 text-muted">Category</dt>
              <dd class="col-sm-7" th:text="${entry.foodItem.category.name}"></dd>
              <dt class="col-sm-5 text-muted">Unit of Measure</dt>
              <dd class="col-sm-7" th:text="${entry.foodItem.unitOfMeasure}"></dd>
              <dt class="col-sm-5 text-muted">Allergen Free</dt>
              <dd class="col-sm-7">
                <span th:if="${entry.foodItem.allergenFree}"
                      class="badge bg-success-subtle text-success">Yes</span>
                <span th:unless="${entry.foodItem.allergenFree}"
                      class="badge bg-danger-subtle text-danger">No</span>
              </dd>
            </dl>
          </div>
        </div>
      </div>
      <div class="col-md-6">
        <div class="card border-0 shadow-sm h-100">
          <div class="card-header bg-primary text-white">
            <h6 class="mb-0"><i class="bi bi-currency-dollar me-2"></i>Cost Details</h6>
          </div>
          <div class="card-body">
            <dl class="row mb-0">
              <dt class="col-sm-5 text-muted">Quantity</dt>
              <dd class="col-sm-7 fw-semibold"
                  th:text="${#numbers.formatDecimal(entry.quantity,1,'COMMA',3,'POINT')}"></dd>
              <dt class="col-sm-5 text-muted">Unit Cost</dt>
              <dd class="col-sm-7"
                  th:text="'$' + ${#numbers.formatDecimal(entry.unitCostUsd,1,'COMMA',4,'POINT')}"></dd>
              <dt class="col-sm-5 text-muted">Total Cost</dt>
              <dd class="col-sm-7 fw-bold text-success fs-5"
                  th:text="'$' + ${#numbers.formatDecimal(entry.computedTotal(),1,'COMMA',2,'POINT')}"></dd>
              <dt class="col-sm-5 text-muted">Entry Date</dt>
              <dd class="col-sm-7"
                  th:text="${#temporals.format(entry.entryDate,'dd-MMM-yyyy')}"></dd>
              <dt class="col-sm-5 text-muted">Invoice Ref</dt>
              <dd class="col-sm-7" th:text="${entry.invoiceRef ?: '—'}"></dd>
              <dt class="col-sm-5 text-muted">PO Number</dt>
              <dd class="col-sm-7" th:text="${entry.poNumber ?: '—'}"></dd>
            </dl>
          </div>
        </div>
      </div>
      <div class="col-12">
        <div class="card border-0 shadow-sm">
          <div class="card-header bg-light">
            <h6 class="mb-0"><i class="bi bi-geo-alt me-2 text-primary"></i>Location &amp; Classification</h6>
          </div>
          <div class="card-body">
            <div class="row">
              <div class="col-md-3">
                <small class="text-muted d-block">Country</small>
                <span class="fw-semibold" th:text="${entry.country.name}"></span>
              </div>
              <div class="col-md-3">
                <small class="text-muted d-block">Region</small>
                <span th:text="${entry.country.region.name}"></span>
              </div>
              <div class="col-md-3">
                <small class="text-muted d-block">Fiscal Period</small>
                <span class="badge bg-primary-subtle text-primary"
                      th:text="${entry.fiscalPeriod.periodName}"></span>
              </div>
              <div class="col-md-3">
                <small class="text-muted d-block">Cost Center</small>
                <span th:text="${entry.costCenter.code}"></span>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="col-12" th:if="${entry.notes}">
        <div class="card border-0 shadow-sm">
          <div class="card-body">
            <small class="text-muted fw-semibold d-block mb-1">NOTES</small>
            <p class="mb-0" th:text="${entry.notes}"></p>
          </div>
        </div>
      </div>
      <div class="col-12">
        <div class="card border-0 bg-light">
          <div class="card-body py-2">
            <small class="text-muted">
              Created by <strong th:text="${entry.createdBy}"></strong>
              on <span th:text="${#temporals.format(entry.createdAt,'dd-MMM-yyyy HH:mm')}"></span>
              <span th:if="${entry.updatedBy}">
                &middot; Updated by <strong th:text="${entry.updatedBy}"></strong>
                on <span th:text="${#temporals.format(entry.updatedAt,'dd-MMM-yyyy HH:mm')}"></span>
              </span>
            </small>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
