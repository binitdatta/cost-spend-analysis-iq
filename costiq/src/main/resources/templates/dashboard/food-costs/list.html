<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Food Cost Entries')}"></head>
<body class="costiq-app d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="costiq-body d-flex flex-grow-1">
  <aside th:replace="~{fragments/layout :: sidebar}"></aside>
  <main class="costiq-main flex-grow-1 p-4 overflow-auto">
    <div th:replace="~{fragments/layout :: flashMessages}"></div>

    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h4 class="fw-bold mb-1"><i class="bi bi-basket2 me-2 text-success"></i>Food Cost Entries</h4>
        <p class="text-muted mb-0 small">All food ingredient procurement cost records</p>
      </div>
      <a th:href="@{/dashboard/food-costs/new}" class="btn btn-success">
        <i class="bi bi-plus-lg me-1"></i>New Entry
      </a>
    </div>

    <div class="card border-0 shadow-sm">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover costiq-table mb-0">
            <thead>
              <tr>
                <th>#</th>
                <th>Entry Date</th>
                <th>Food Item</th>
                <th>Country / Region</th>
                <th>Supplier</th>
                <th>Fiscal Period</th>
                <th class="text-end">Qty</th>
                <th class="text-end">Unit Cost</th>
                <th class="text-end">Total Cost (USD)</th>
                <th>Invoice</th>
                <th>PO #</th>
                <th class="text-center">Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr th:if="${entries.isEmpty()}">
                <td colspan="12" class="text-center text-muted py-5">
                  <i class="bi bi-inbox fs-3 d-block mb-2"></i>No food cost entries found.
                </td>
              </tr>
              <tr th:each="e : ${entries.content}">
                <td class="text-muted small" th:text="${e.id}"></td>
                <td th:text="${#temporals.format(e.entryDate,'dd-MMM-yyyy')}"></td>
                <td>
                  <span class="fw-semibold" th:text="${e.foodItem.name}"></span>
                  <br/><small class="text-muted" th:text="${e.foodItem.sku}"></small>
                </td>
                <td>
                  <span th:text="${e.country.name}"></span>
                  <br/><small class="badge bg-secondary-subtle text-secondary"
                              th:text="${e.country.region.name}"></small>
                </td>
                <td th:text="${e.supplier.name}"></td>
                <td><span class="badge bg-primary-subtle text-primary"
                          th:text="${e.fiscalPeriod.periodName}"></span></td>
                <td class="text-end"
                    th:text="${#numbers.formatDecimal(e.quantity,1,'COMMA',3,'POINT')}"></td>
                <td class="text-end"
                    th:text="'$' + ${#numbers.formatDecimal(e.unitCostUsd,1,'COMMA',4,'POINT')}"></td>
                <td class="text-end fw-semibold text-success"
                    th:text="'$' + ${#numbers.formatDecimal(e.computedTotal(),1,'COMMA',2,'POINT')}"></td>
                <td class="text-muted small" th:text="${e.invoiceRef ?: '—'}"></td>
                <td class="text-muted small" th:text="${e.poNumber ?: '—'}"></td>
                <td class="text-center">
                  <div class="btn-group btn-group-sm">
                    <a th:href="@{/dashboard/food-costs/{id}/view(id=${e.id})}"
                       class="btn btn-outline-secondary" title="View">
                      <i class="bi bi-eye"></i>
                    </a>
                    <a th:href="@{/dashboard/food-costs/{id}/edit(id=${e.id})}"
                       class="btn btn-outline-primary" title="Edit">
                      <i class="bi bi-pencil"></i>
                    </a>
                    <button type="button" class="btn btn-outline-danger" title="Delete"
                            data-bs-toggle="modal"
                            th:data-bs-target="'#deleteModal' + ${e.id}">
                      <i class="bi bi-trash"></i>
                    </button>
                  </div>
                  <!-- Delete Modal -->
                  <div class="modal fade" th:id="'deleteModal' + ${e.id}" tabindex="-1">
                    <div class="modal-dialog modal-sm">
                      <div class="modal-content">
                        <div class="modal-header border-0">
                          <h6 class="modal-title text-danger">
                            <i class="bi bi-exclamation-triangle me-2"></i>Confirm Delete
                          </h6>
                          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body py-2">
                          <p class="mb-1 small">Delete food cost entry
                            <strong th:text="'#' + ${e.id}"></strong>?</p>
                          <p class="text-muted small mb-0" th:text="${e.foodItem.name}"></p>
                        </div>
                        <div class="modal-footer border-0 pt-0">
                          <button type="button" class="btn btn-secondary btn-sm"
                                  data-bs-dismiss="modal">Cancel</button>
                          <form th:action="@{/dashboard/food-costs/{id}/delete(id=${e.id})}"
                                method="post" class="d-inline">
                            <input type="hidden" th:name="${_csrf.parameterName}"
                                   th:value="${_csrf.token}"/>
                            <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                          </form>
                        </div>
                      </div>
                    </div>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
      <!-- Pagination -->
      <div class="card-footer bg-white d-flex justify-content-between align-items-center"
           th:if="${totalPages > 1}">
        <small class="text-muted"
               th:text="'Page ' + (${currentPage}+1) + ' of ' + ${totalPages}"></small>
        <nav>
          <ul class="pagination pagination-sm mb-0">
            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
              <a class="page-link"
                 th:href="@{/dashboard/food-costs(page=${currentPage-1})}">
                <i class="bi bi-chevron-left"></i></a>
            </li>
            <li class="page-item"
                th:classappend="${currentPage+1 == totalPages} ? 'disabled'">
              <a class="page-link"
                 th:href="@{/dashboard/food-costs(page=${currentPage+1})}">
                <i class="bi bi-chevron-right"></i></a>
            </li>
          </ul>
        </nav>
      </div>
    </div>
  </main>
</div>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
