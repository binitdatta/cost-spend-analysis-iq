<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Marketing Costs')}"></head>
<body class="costiq-app d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="costiq-body d-flex flex-grow-1">
  <aside th:replace="~{fragments/layout :: sidebar}"></aside>
  <main class="costiq-main flex-grow-1 p-4 overflow-auto">
    <div th:replace="~{fragments/layout :: flashMessages}"></div>

    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h4 class="fw-bold mb-1"><i class="bi bi-megaphone me-2 text-danger"></i>Campaign Marketing Costs</h4>
        <p class="text-muted mb-0 small">TV, digital, social media, print, events and agency spend</p>
      </div>
      <a th:href="@{/dashboard/marketing-costs/new}" class="btn btn-danger">
        <i class="bi bi-plus-lg me-1"></i>New Cost Entry
      </a>
    </div>

    <div class="card border-0 shadow-sm">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover costiq-table mb-0">
            <thead>
              <tr>
                <th>#</th>
                <th>Date</th>
                <th>Campaign</th>
                <th>Cost Type</th>
                <th>Vendor</th>
                <th>Cost Center</th>
                <th>Fiscal Period</th>
                <th class="text-end">Amount (USD)</th>
                <th>Invoice</th>
                <th class="text-center">Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr th:if="${entries.isEmpty()}">
                <td colspan="10" class="text-center text-muted py-5">
                  <i class="bi bi-inbox fs-3 d-block mb-2"></i>No marketing cost entries found.
                </td>
              </tr>
              <tr th:each="e : ${entries.content}">
                <td class="text-muted small" th:text="${e.id}"></td>
                <td th:text="${#temporals.format(e.entryDate,'dd-MMM-yyyy')}"></td>
                <td>
                  <span class="fw-semibold" th:text="${e.campaign.name}"></span>
                  <br/>
                  <span class="badge"
                        th:classappend="${e.campaign.status.name() == 'ACTIVE'} ? 'bg-success-subtle text-success' : 'bg-secondary-subtle text-secondary'"
                        th:text="${e.campaign.status}"></span>
                </td>
                <td>
                  <span class="badge bg-danger-subtle text-danger"
                        th:text="${e.costType}"></span>
                </td>
                <td th:text="${e.vendorName ?: '—'}"></td>
                <td>
                  <small th:text="${e.costCenter.code}"></small>
                </td>
                <td><span class="badge bg-primary-subtle text-primary"
                          th:text="${e.fiscalPeriod.periodName}"></span></td>
                <td class="text-end fw-semibold text-danger"
                    th:text="'$' + ${#numbers.formatDecimal(e.amountUsd,1,'COMMA',2,'POINT')}"></td>
                <td class="text-muted small" th:text="${e.invoiceRef ?: '—'}"></td>
                <td class="text-center">
                  <div class="btn-group btn-group-sm">
                    <a th:href="@{/dashboard/marketing-costs/{id}/view(id=${e.id})}"
                       class="btn btn-outline-secondary"><i class="bi bi-eye"></i></a>
                    <a th:href="@{/dashboard/marketing-costs/{id}/edit(id=${e.id})}"
                       class="btn btn-outline-primary"><i class="bi bi-pencil"></i></a>
                    <button type="button" class="btn btn-outline-danger"
                            data-bs-toggle="modal"
                            th:data-bs-target="'#delMkt' + ${e.id}">
                      <i class="bi bi-trash"></i>
                    </button>
                  </div>
                  <div class="modal fade" th:id="'delMkt' + ${e.id}" tabindex="-1">
                    <div class="modal-dialog modal-sm">
                      <div class="modal-content">
                        <div class="modal-header border-0">
                          <h6 class="modal-title text-danger">Confirm Delete</h6>
                          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body py-2">
                          <p class="mb-0 small">Delete marketing cost
                            <strong th:text="'#' + ${e.id}"></strong>?</p>
                        </div>
                        <div class="modal-footer border-0 pt-0">
                          <button type="button" class="btn btn-secondary btn-sm"
                                  data-bs-dismiss="modal">Cancel</button>
                          <form th:action="@{/dashboard/marketing-costs/{id}/delete(id=${e.id})}"
                                method="post" class="d-inline">
                            <input type="hidden" th:name="${_csrf.parameterName}"
                                   th:value="${_csrf.token}"/>
                            <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                          </form>
                        </div>
                      </div>
                    </div>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
      <div class="card-footer bg-white d-flex justify-content-between align-items-center"
           th:if="${totalPages > 1}">
        <small class="text-muted"
               th:text="'Page ' + (${currentPage}+1) + ' of ' + ${totalPages}"></small>
        <nav><ul class="pagination pagination-sm mb-0">
          <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
            <a class="page-link" th:href="@{/dashboard/marketing-costs(page=${currentPage-1})}">
              <i class="bi bi-chevron-left"></i></a></li>
          <li class="page-item" th:classappend="${currentPage+1 == totalPages} ? 'disabled'">
            <a class="page-link" th:href="@{/dashboard/marketing-costs(page=${currentPage+1})}">
              <i class="bi bi-chevron-right"></i></a></li>
        </ul></nav>
      </div>
    </div>
  </main>
</div>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
