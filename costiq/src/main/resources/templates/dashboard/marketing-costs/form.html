<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body class="costiq-app d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="costiq-body d-flex flex-grow-1">
  <aside th:replace="~{fragments/layout :: sidebar}"></aside>
  <main class="costiq-main flex-grow-1 p-4 overflow-auto">
    <div class="d-flex align-items-center mb-4">
      <a th:href="@{/dashboard/marketing-costs}" class="btn btn-outline-secondary btn-sm me-3">
        <i class="bi bi-arrow-left me-1"></i>Back
      </a>
      <div>
        <h4 class="fw-bold mb-0" th:text="${pageTitle}">Marketing Cost</h4>
        <p class="text-muted small mb-0"
           th:text="${isEdit} ? 'Modify marketing cost entry' : 'Record a new campaign marketing cost'"></p>
      </div>
    </div>

    <div class="card border-0 shadow-sm" style="max-width:800px;">
      <div class="card-header bg-danger text-white py-3">
        <h6 class="mb-0">
          <i class="bi bi-megaphone me-2"></i>
          <span th:text="${isEdit} ? 'Edit Marketing Cost' : 'New Marketing Cost'"></span>
        </h6>
      </div>
      <div class="card-body p-4">
        <form th:action="${isEdit} ? @{/dashboard/marketing-costs/{id}/edit(id=${form.id})} : @{/dashboard/marketing-costs/new}"
              th:object="${form}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Campaign <span class="text-danger">*</span></label>
              <select th:field="*{campaignId}" class="form-select"
                      th:classappend="${#fields.hasErrors('campaignId')} ? 'is-invalid'">
                <option value="">— Select Campaign —</option>
                <option th:each="c : ${campaigns}"
                        th:value="${c.id}"
                        th:text="${c.name + ' [' + c.status + ']'}"></option>
              </select>
              <div class="invalid-feedback" th:errors="*{campaignId}"></div>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Cost Type <span class="text-danger">*</span></label>
              <select th:field="*{costType}" class="form-select"
                      th:classappend="${#fields.hasErrors('costType')} ? 'is-invalid'">
                <option value="">— Select Type —</option>
                <option th:each="ct : ${costTypes}"
                        th:value="${ct}"
                        th:text="${ct}"></option>
              </select>
              <div class="invalid-feedback" th:errors="*{costType}"></div>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Cost Center <span class="text-danger">*</span></label>
              <select th:field="*{costCenterId}" class="form-select"
                      th:classappend="${#fields.hasErrors('costCenterId')} ? 'is-invalid'">
                <option value="">— Select Cost Center —</option>
                <option th:each="cc : ${costCenters}"
                        th:value="${cc.id}"
                        th:text="${cc.code + ' — ' + cc.name}"></option>
              </select>
              <div class="invalid-feedback" th:errors="*{costCenterId}"></div>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Fiscal Period <span class="text-danger">*</span></label>
              <select th:field="*{fiscalPeriodId}" class="form-select"
                      th:classappend="${#fields.hasErrors('fiscalPeriodId')} ? 'is-invalid'">
                <option value="">— Select Period —</option>
                <option th:each="fp : ${periods}"
                        th:value="${fp.id}"
                        th:text="${fp.displayName}"></option>
              </select>
              <div class="invalid-feedback" th:errors="*{fiscalPeriodId}"></div>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Amount (USD) <span class="text-danger">*</span></label>
              <div class="input-group">
                <span class="input-group-text">$</span>
                <input type="number" th:field="*{amountUsd}" class="form-control"
                       step="0.01" min="0.01"
                       th:classappend="${#fields.hasErrors('amountUsd')} ? 'is-invalid'"/>
                <div class="invalid-feedback" th:errors="*{amountUsd}"></div>
              </div>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Entry Date <span class="text-danger">*</span></label>
              <input type="date" th:field="*{entryDate}" class="form-control"
                     th:classappend="${#fields.hasErrors('entryDate')} ? 'is-invalid'"/>
              <div class="invalid-feedback" th:errors="*{entryDate}"></div>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Vendor / Media Partner</label>
              <input type="text" th:field="*{vendorName}" class="form-control"
                     placeholder="e.g. NBCUniversal, Google Ads"/>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Invoice Reference</label>
              <input type="text" th:field="*{invoiceRef}" class="form-control"/>
            </div>
            <div class="col-12">
              <label class="form-label fw-semibold">Description</label>
              <textarea th:field="*{description}" class="form-control" rows="2"
                        placeholder="Brief description of the marketing spend..."></textarea>
            </div>
          </div>
          <hr class="my-4"/>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-danger px-4">
              <i class="bi bi-check-lg me-1"></i>
              <span th:text="${isEdit} ? 'Update Entry' : 'Create Entry'"></span>
            </button>
            <a th:href="@{/dashboard/marketing-costs}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </main>
</div>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
